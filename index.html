<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ride & Co — Emprunts de matériel</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-text-primary: #1a1a1a;
      --color-text-secondary: #6b7280;
      --color-background-primary: #ffffff;
      --color-background-secondary: #f3f4f6;
      --color-border-tertiary: #e5e7eb;
      --border-radius-md: 8px;
      --border-radius-lg: 12px;
      --font-sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    }
    body { font-family: var(--font-sans); background: #f9fafb; color: var(--color-text-primary); }
    .app { max-width: 820px; margin: 0 auto; padding: 1rem; }
    .header { display:flex; align-items:center; gap:12px; padding:1rem; background:#fff; border-radius:var(--border-radius-lg); margin-bottom:1rem; box-shadow:0 1px 3px rgba(0,0,0,.06); }
    .logo { width:40px; height:40px; border-radius:50%; background:#185FA5; display:flex; align-items:center; justify-content:center; }
    .logo i { color:#E6F1FB; font-size:20px; }
    .h1 { font-size:18px; font-weight:500; }
    .sub { font-size:13px; color:var(--color-text-secondary); }
    .tabs { display:flex; gap:4px; margin-bottom:1.5rem; border-bottom:0.5px solid var(--color-border-tertiary); flex-wrap:wrap; }
    .tab { padding:8px 14px; font-size:13px; cursor:pointer; border:none; background:none; color:var(--color-text-secondary); border-bottom:2px solid transparent; margin-bottom:-0.5px; font-family:var(--font-sans); }
    .tab.active { color:#185FA5; border-bottom-color:#185FA5; font-weight:500; }
    .tab.admin-tab { color:#8B5E00; }
    .tab.admin-tab.active { color:#8B5E00; border-bottom-color:#EF9F27; font-weight: 500; }
    .section { display:none; }
    .section.active { display:block; }
    .card { background:#fff; border:0.5px solid var(--color-border-tertiary); border-radius:var(--border-radius-lg); padding:1.25rem; margin-bottom:1rem; box-shadow:0 1px 3px rgba(0,0,0,.04); }
    label { font-size:13px; color:var(--color-text-secondary); display:block; margin-bottom:4px; margin-top:12px; }
    label:first-of-type { margin-top:0; }
    input, select { width:100%; padding:8px 10px; border:0.5px solid var(--color-border-tertiary); border-radius:var(--border-radius-md); font-size:14px; background:#fff; color:var(--color-text-primary); font-family:var(--font-sans); }
    input:focus, select:focus { outline:none; border-color:#185FA5; box-shadow:0 0 0 2px #B5D4F4; }
    .btn { display:inline-flex; align-items:center; gap:6px; padding:9px 18px; border-radius:var(--border-radius-md); font-size:14px; cursor:pointer; border:0.5px solid var(--color-border-tertiary); background:#fff; color:var(--color-text-primary); font-family:var(--font-sans); }
    .btn:hover { background:#f3f4f6; }
    .btn-primary { background:#185FA5; color:#E6F1FB; border-color:#185FA5; }
    .btn-primary:hover { background:#0C447C; }
    .btn-ghost { background:none; border:none; color:#185FA5; font-size:13px; cursor:pointer; padding:4px 0; font-family:var(--font-sans); }
    .btn-ghost:hover { text-decoration:underline; }
    .btn-return { background:none; border:0.5px solid #185FA5; color:#185FA5; font-size:12px; padding:5px 10px; border-radius:var(--border-radius-md); cursor:pointer; font-family:var(--font-sans); display:inline-flex; align-items:center; gap:4px; }
    .btn-return:hover { background:#E6F1FB; }
    .status-on-time { background:#EAF3DE; color:#27500A; padding:3px 10px; border-radius:var(--border-radius-md); font-size:12px; font-weight:500; }
    .status-late { background:#FCEBEB; color:#791F1F; padding:3px 10px; border-radius:var(--border-radius-md); font-size:12px; font-weight:500; }
    .grid2 { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
    .alert { background:#FAEEDA; border:0.5px solid #EF9F27; border-radius:var(--border-radius-md); padding:10px 14px; font-size:13px; color:#633806; margin-bottom:1rem; display:flex; align-items:center; gap:8px; }
    .loading { text-align:center; padding:3rem; color:var(--color-text-secondary); font-size:14px; }
    .empty { text-align:center; padding:1.5rem; color:var(--color-text-secondary); font-size:14px; }
    .user-info { margin-left:auto; display:flex; align-items:center; gap:8px; }
    .user-badge { background:#f3f4f6; border-radius:99px; padding:4px 12px; font-size:13px; color:var(--color-text-secondary); }
    .err { color:#A32D2D; font-size:12px; margin-top:4px; display:none; }
  </style>
</head>
<body>
<div class="app">

  <div class="header">
    <div class="logo"><i class="ti ti-wave-sine"></i></div>
    <div><div class="h1">Ride &amp; Co</div><div class="sub">Gestion des emprunts de matériel</div></div>
    <div class="user-info" id="user-info" style="display:none;">
      <span class="user-badge" id="user-name-display"></span>
      <span class="badge-admin" id="admin-badge" style="display:none; background:#FAEEDA; color:#8B5E00; padding:2px 8px; border-radius:99px; font-size:11px;">Admin</span>
      <button class="btn" style="font-size:12px;padding:5px 10px;" onclick="doLogout()"><i class="ti ti-logout"></i> Déconnexion</button>
    </div>
  </div>

  <div id="auth-section" style="display:none;">
    <div id="auth-login-view" class="card" style="max-width:420px; margin: 0 auto;">
      <h2 style="text-align:center; margin-bottom:1rem;">Connexion</h2>
      <div id="login-success" class="alert" style="display:none; background:#EAF3DE; border-color:#639922; color:#27500A;">Compte créé !</div>
      <label>Email</label>
      <input type="email" id="login-email" placeholder="prenom.nom@2029.icam.fr" />
      <label>Mot de passe</label>
      <input type="password" id="login-pw" placeholder="••••••••" />
      <p class="err" id="login-err">Identifiants incorrects.</p>
      <button class="btn btn-primary" style="width:100%; margin-top:1rem;" onclick="doLogin()">Se connecter</button>
      <div style="text-align:center; margin-top:1rem;"><button class="btn-ghost" onclick="showRegister()">Créer un compte</button></div>
    </div>

    <div id="auth-register-view" class="card" style="max-width:420px; margin: 0 auto; display:none;">
      <h2 style="text-align:center; margin-bottom:1rem;">Inscription</h2>
      <label>Email @icam.fr</label>
      <input type="email" id="reg-email" placeholder="votre.nom@icam.fr" />
      <label>Mot de passe (6 car. min)</label>
      <input type="password" id="reg-pw" />
      <label>Confirmer le mot de passe</label>
      <input type="password" id="reg-pw2" />
      <p class="err" id="reg-err">Vérifiez les informations.</p>
